services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movie-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      VITE_HOST: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - movie-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache/pip
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - movie-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  frontend_node_modules:
  backend_cache:

networks:
  movie-network:
    driver: bridge
