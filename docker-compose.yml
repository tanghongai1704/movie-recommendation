services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: movie-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_HOST: 0.0.0.0
    depends_on:
      - backend
    networks:
      - movie-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache/pip
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      - movie-network

volumes:
  frontend_node_modules:
  backend_cache:

networks:
  movie-network:
    driver: bridge
