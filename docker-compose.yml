name: ${COMPOSE_PROJECT_NAME:-movie-recommendation}

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_CONTAINER_PORT: ${FRONTEND_CONTAINER_PORT:-5173}
    container_name: ${FRONTEND_CONTAINER_NAME:-movie-frontend}
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      VITE_HOST: ${VITE_HOST:-0.0.0.0}
      VITE_PORT: ${FRONTEND_CONTAINER_PORT:-5173}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - movie-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_CONTAINER_PORT: ${BACKEND_CONTAINER_PORT:-8000}
    container_name: ${BACKEND_CONTAINER_NAME:-movie-backend}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:${BACKEND_CONTAINER_PORT:-8000}"
    volumes:
      - ./backend:/app
      - backend_cache:/root/.cache/pip
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      API_HEALTH_PATH: ${API_HEALTH_PATH:-/health}
      BACKEND_HOST: ${BACKEND_HOST:-0.0.0.0}
      BACKEND_PORT: ${BACKEND_CONTAINER_PORT:-8000}
      BACKEND_RELOAD: ${BACKEND_RELOAD:-true}
      PYTHONUNBUFFERED: "1"
    networks:
      - movie-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ['BACKEND_PORT']}{os.environ['API_HEALTH_PATH']}\", timeout=5)",
        ]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      retries: ${HEALTHCHECK_RETRIES:-5}

volumes:
  frontend_node_modules:
  backend_cache:

networks:
  movie-network:
    driver: bridge
